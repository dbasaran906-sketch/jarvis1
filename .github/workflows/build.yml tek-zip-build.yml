name: Jarvis APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ZIP'i ac
        run: |
          ZIP=$(ls *.zip | head -n 1)
          mkdir proj
          unzip -q "$ZIP" -d proj
          ls proj

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android lisanslarini onayla
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: APK derle
        working-directory: proj
        run: >
          gradle assembleRelease --no-daemon
          -PversionCode=${{ github.run_number }}
          -PrepoSlug=${{ github.repository }}

      - name: Release olarak yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          cp proj/app/build/outputs/apk/release/app-release.apk Jarvis.apk
          gh release create "$TAG" Jarvis.apk --title "Jarvis $TAG" --notes "Jarvis $TAG" --latest
